<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Rental MS</title>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"
/>
</head>
<body>
    
    <header>
        <div class="container flex-header">
            <div class="logo">
                <a href="dashboard.html" class="logo-link">
                    <img src="img/Logo-HRMS.png" alt="This is a logo.">
                </a>
            </div>

            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link active">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Properties</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Agents</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Reports</a>
                    </li>

                    <div class="registration">
                        <a href="#" class="search-link" id="search-link">Search <i class="ri-search-2-line"></i></a>
                        <a href="#" class="registration-link"><i class="ri-upload-cloud-2-line"></i> Upload</a>
                    </div>
                </ul>
            </nav>

            <button class="navbar-toggle">
                <span class="bar"></span>
                <span class="bar bar-2"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="main-content">
                <div class="main-title">
                    <p>Find your perfect</p>
                    <h1>HOUSE</h1>
                </div>
                <div class="main-img">
                    <img src="img/House.png" alt="This is a house background.">
                </div>
            </div>
            <div class="explore">
                <a href="#" class="explore-link" id="explore-link">Explore Now <i class="ri-arrow-right-double-fill"></i></a>
            </div>
            <div class="rotation">
                    <div class="rotation_1"></div>
            </div>

            <div class="search-engine" id="search-engine">
                <div class="overlay"></div>
                <form action="House/formhandler.php" action="post" class="form">
                    <input type="text" name="location" id="location" placeholder="Location" required>
                    <select name="property-type" id="property-type">
                        <option value="property-type">Select Property</option>
                        <option value="apartment">Apartment</option>
                        <option value="real-state">Real State</option>
                        <option value="warehouse">Warehouse</option>
                        <option value="condominium">Condominium</option>
                    </select>
                    <input type="number" name="price" id="price" placeholder="Max-Price" required>
                    <div class="controls">
                        <button class="close-btn btn">Close</button>
                        <button class="submit-btn btn" type="submit">Search</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="category-back-clr">
            <div class="container">
                    <div class="category">
                        <div class="category-item">
                            <img src="img/apartment.png" alt="Apartment image">
                            <h3>Apartment</h3>
                            <a href="#" class="category-item-link">View <i class="ri-arrow-right-up-line"></i></a>
                        </div>
                        <div class="category-item">
                            <img src="img/real-state.png" alt="Apartment image">
                            <h3>Real State</h3>
                            <a href="#" class="category-item-link">View <i class="ri-arrow-right-up-line"></i></a>
                        </div>
                        <div class="category-item">
                            <img src="img/warehouse.png" alt="Apartment image">
                            <h3>Warehouse</h3>
                            <a href="#" class="category-item-link">View <i class="ri-arrow-right-up-line"></i></a>
                        </div>
                        <div class="category-item">
                            <img src="img/condominium.png" alt="Apartment image">
                            <h3>Condominium</h3>
                            <a href="#" class="category-item-link">View <i class="ri-arrow-right-up-line"></i></a>
                        </div>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
